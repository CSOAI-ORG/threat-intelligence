[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-intelligence-mcp"
version = "0.1.0"
description = "MCP server correlating NVD, OSV.dev, and GitHub Security Advisories to endpoint and package inventories"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "MEOK AI Labs", email = "nicholas@meok.ai"},
]
keywords = ["mcp", "model-context-protocol", "cve", "nvd", "osv", "ghsa", "threat-intelligence", "vulnerability", "meok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "respx>=0.20",
]

[project.urls]
Homepage = "https://github.com/CSOAI-ORG/threat-intelligence"
Repository = "https://github.com/CSOAI-ORG/threat-intelligence"
Issues = "https://github.com/CSOAI-ORG/threat-intelligence/issues"
PyPI = "https://pypi.org/project/threat-intelligence-mcp/"
Smithery = "https://smithery.ai/server/threat-intelligence-mcp"

[project.scripts]
threat_intelligence_mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
